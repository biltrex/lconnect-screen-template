<!DOCTYPE html>
<!-- Minimal design that follows references/design-contract.md. Uses Bahnschrift, which ships with
     Windows 10/11 for all users, so it converts with no font installs. Copy and restyle freely. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starter screen</title>
<style>
  html, body { margin:0; width:1920px; height:480px; overflow:hidden; background:#000; }
  body { position:relative; font-family:'Bahnschrift', sans-serif; color:#E6EDF3; }
  .abs { position:absolute; }
  .panel { position:absolute; border:2px solid #1F6FEB; border-radius:18px; background:#0D1117; }
  .label { position:absolute; font-size:26px; font-weight:300; letter-spacing:4px; color:#7D8590; }
  .big { position:absolute; font-size:120px; font-weight:600; line-height:1; text-align:right; }
  .unit { position:absolute; font-size:40px; font-weight:300; color:#7D8590; }
  .track { position:absolute; display:flex; gap:4px; }
  .track i { flex:1; display:block; }
</style>
</head>
<body>
  <!-- static art -->
  <div class="panel" style="left:24px;top:24px;width:600px;height:432px"></div>
  <div class="panel" style="left:660px;top:24px;width:600px;height:432px"></div>
  <div class="panel" style="left:1296px;top:24px;width:600px;height:432px"></div>
  <div class="label" data-lc="label" data-align="left" style="left:64px;top:56px">CPU</div>
  <div class="label" data-lc="label" data-align="left" style="left:700px;top:56px">GPU</div>
  <div class="label" data-lc="label" data-align="left" style="left:1336px;top:56px">TIME</div>
  <div class="unit" data-lc="label" data-align="left" style="left:476px;top:206px">°C</div>
  <div class="unit" data-lc="label" data-align="left" style="left:1112px;top:206px">°C</div>

  <!-- live values -->
  <div class="big" data-lc="text" data-sensor="CPUTEMP" data-align="right" data-label="CPU temp"
       style="left:200px;top:140px;width:266px;color:#2F81F7">58</div>
  <div class="big" data-lc="text" data-sensor="GPUTEMP" data-align="right" data-label="GPU temp"
       style="left:836px;top:140px;width:266px;color:#A371F7">51</div>
  <div class="big" data-lc="text" data-sensor="TIME" data-sub="h:m" data-align="center" data-label="Clock"
       style="left:1296px;top:140px;width:600px;text-align:center;color:#E6EDF3">14:07</div>
  <div class="abs" data-lc="text" data-sensor="DATE" data-sub="Y-M-D" data-align="center" data-label="Date"
       style="left:1296px;top:300px;width:600px;text-align:center;font-size:40px;font-weight:300;color:#7D8590">2026-11-19</div>

  <!-- live bars: the helper script at the bottom draws their browser preview from the data-* attributes -->
  <div class="track" data-lc="bar" data-sensor="CPULOAD" data-segments="20" data-gap="4"
       data-on="#2F81F7" data-off="#12263F" data-sample="35" style="left:64px;top:360px;width:520px;height:36px"></div>
  <div class="track" data-lc="bar" data-sensor="GPULOAD" data-segments="20" data-gap="4"
       data-on="#A371F7" data-off="#21183A" data-sample="60" style="left:700px;top:360px;width:520px;height:36px"></div>
  <div class="label" data-lc="label" data-align="left" style="left:64px;top:410px;font-size:20px">LOAD</div>
  <div class="label" data-lc="label" data-align="left" style="left:700px;top:410px;font-size:20px">LOAD</div>

  <script>
  // Preview-only: draw every native bar from its attributes (segments, gap, on/off colours, sample %).
  // Runs before 'load', so the exporter captures it; L-Connect replaces these with native bars.
  document.querySelectorAll('[data-lc="bar"]').forEach(bar => {
    const n = +bar.dataset.segments || 1, lit = Math.round((+bar.dataset.sample || 0) / 100 * n);
    bar.style.display = 'flex'; bar.style.gap = (+bar.dataset.gap || 0) + 'px';
    bar.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const seg = document.createElement('i');
      seg.style.cssText = `flex:1;display:block;background:${i < lit ? bar.dataset.on : bar.dataset.off}`;
      bar.appendChild(seg);
    }
  });
  </script>
</body>
</html>
